 else{const [Y,Mo]=mk.split("-").map(Number),nd=new Date(Date.UTC(Y,Mo,0)).getUTCDate(),off=(new Date(Date.UTC(Y,Mo-1,1)).getUTCDay()+6)%7;

function dtab(w,P,DS){
 const cols=Q<2?[Q]:[0,1,2],ds=cols.map(i=>DS[w][i]),hs=cols.map(i=>i<2?P[w][i].h:P[w][0].h+P[w][1].h);
 return tbl(["",...cols.map(i=>Q<2?PL[i]:["1ª quinc.","2ª quinc.","Mes"][i])],dayRows(ds,hs),"dd");

function renderN(){
 const data=calc(mk),[Y,Mo]=mk.split("-").map(Number);
 const P=PA(mk),DS=NM.map((_,w)=>dstat(mk,w));
 const sel=w=>Q===2?sumP(P[w][0],P[w][1]):P[w][Q],all=NM.map((_,w)=>sel(w));
 const tn=all.reduce((s,p)=>s+p.net,0),td=all.reduce((s,p)=>s+p.tot,0),te=all.reduce((s,p)=>s+p.ext,0);
 const ql=["1ª quincena","2ª quincena","Mes completo"];
 const cards=NM.map((n,w)=>{
  const p=all[w],t=p.tot||1;let ctrl="";
  if(Q<2){const k=mk+"|"+w+"|"+Q,adj=S.adj[k]||[];
   ctrl=`<div class="grp"><h4>Registro de la quincena</h4><div class="hrs"><label for="r${w}">Horas reales</label><input id="r${w}" type="number" min="0" step="0.5" placeholder="${hh(data[w][Q].h)}" value="${S.real[k]??""}" data-k="${k}"></div>`+adj.map((a,i)=>`<div class="adj"><span>${a.c}</span><span class="${a.v<0?"neg":"pos"}">${money(a.v)} <button data-rm="${k}|${i}" aria-label="Quitar ajuste">✕</button></span></div>`).join("")+`<div class="act"><button class="btn g s" data-add="${k}">+ Ajuste</button></div></div>`}
  return `<article class="wk"><details data-i="${w}" ${OPEN.has(w)?"open":""}><summary><span class="nm">${n}</span><span class="hh">${hh(p.h)} h</span><b class="amt">${money(p.net)}</b></summary><div class="det">
  <div class="grp"><h4>Días y horas trabajadas</h4>${dtab(w,P,DS)}</div>
  <div class="grp"><h4>Horas</h4><div class="row"><span>Horas normales</span><b>${hh(p.ord)}</b></div><div class="row"><span>Horas extra</span><b>${hh(p.ext)}</b></div><div class="row"><span>Horas de noche</span><b>${hh(p.noc)}</b></div><div class="row"><span>Domingos y festivos</span><b>${hh(p.dom)}</b></div></div>
  <div class="grp"><h4>Pago</h4><div class="pbar"><i style="width:${p.bas/t*100}%;background:var(--red)"></i><i style="width:${(p.rn+p.rd)/t*100}%;background:var(--amb)"></i><i style="width:${p.ex/t*100}%;background:var(--yel)"></i></div>
  <div class="row"><span><u style="background:var(--red)"></u>Básico</span><b>${money(p.bas)}</b></div><div class="row"><span><u style="background:var(--amb)"></u>Recargos</span><b>${money(p.rn+p.rd)}</b></div><div class="row"><span><u style="background:var(--yel)"></u>Extras</span><b>${money(p.ex)}</b></div>
  <div class="row tot"><span>Total devengado</span><b>${money(p.tot)}</b></div><div class="row"><span>Salud y pensión</span><b class="neg">${money(-p.ded)}</b></div>
  ${p.aj?`<div class="row"><span>Ajustes</span><b class="${p.aj<0?"neg":"pos"}">${money(p.aj)}</b></div>`:""}<div class="row tot"><span>Neto</span><b>${money(p.net)}</b></div></div>${ctrl}<div class="act"><button class="btn g s" data-pdf="${w}">Ver PDF de ${n}</button></div></div></details></article>`}).join("");
 $("n").innerHTML=`<h2>Nómina</h2><div class="seg">${ql.map((l,i)=>`<button data-q="${i}" class="${Q===i?"on":""}">${l}</button>`).join("")}</div>
 <div class="card hero"><small>Neto total</small><b>${money(tn)}</b><div class="sub"><span>Devengado <strong>${money(td)}</strong></span><span><strong>${hh(te)} h</strong> extra</span></div></div>
 <div class="card list">${cards}</div><div class="act"><button class="btn g" data-pdf="all">Ver PDF general</button></div>`;
}
function renderA(){
 $("a").innerHTML=`<h2>Ajustes</h2><div class="card"><div class="fld"><label for="sm">Salario mínimo mensual (2027 provisional)</label><input id="sm" type="number" value="${S.sm}"></div>
 <div class="act"><button class="btn g" id="rs">Borrar mis cambios</button></div></div>`;
}
const render=()=>{renderHome();renderT();renderH();renderN();renderA()};
function go(v){view=v;["home","t","h","n","a"].forEach(i=>$(i).hidden=i!==v);$("bk").hidden=v==="home";mesSel.hidden=!(v==="h"||v==="n");document.body.classList.toggle("hm",v==="home");window.scrollTo(0,0)}
const openSheet=h=>{$("sheet").innerHTML=h;$("md").hidden=false},closeSheet=()=>{$("md").hidden=true};
$("md").addEventListener("click",e=>{if(e.target.id==="md"||e.target.dataset.x)closeSheet()});
document.addEventListener("toggle",e=>{const d=e.target;if(d.dataset&&d.dataset.i!==undefined){const i=+d.dataset.i;d.open?OPEN.add(i):OPEN.delete(i)}},true);
document.addEventListener("click",e=>{
 const b=e.target.closest("button");if(!b)return;const X=b.dataset;
 if(X.go)go(X.go);
 else if(b.id==="bk")go("home");
 else if(X.hv){HV=X.hv;renderH()}
 else if(X.ws){wsel=+X.ws;renderH()}
 else if(X.nav){const st=HV==="sem"?7*D:D;cur=clamp(cur+ +X.nav*st);mk=key(HV==="sem"?mon(cur):cur);mesSel.value=mk;render()}
 else if(X.q!==undefined){Q=+X.q;renderN()}
 else if(X.w!==undefined&&b.classList.contains("cell")){
  const w=+X.w,t=+X.t,d=new Date(t),k=iso(t)+"|"+w;
  const opts=Object.keys(TX).filter(c=>w===5?c==="NU"||c==="L":c!=="NU").map(c=>`<button class="opt ${c}" data-set="${c}" data-k="${k}"><i class="dot"></i><span>${TX[c]}<small>${c==="L"?"sin turno":lg(c,t)}</small></span></button>`).join("");
  openSheet(`<h3>${NM[w]}, ${DN[d.getUTCDay()]} ${fd(t)}</h3><p class="mut">Elige el turno que sí trabajó.</p><div class="opts">${opts}</div><div class="act"><button class="btn g" data-reset="${k}">Turno original</button><button class="btn g" data-x="1">Cerrar</button></div>`)}
 else if(X.set){S.ov[X.k]=X.set;save();closeSheet();render()}
 else if(X.reset){delete S.ov[X.reset];save();closeSheet();render()}
 else if(X.add){openSheet(`<h3>Nuevo ajuste</h3><div class="fld"><label for="ac">Concepto</label><input id="ac" type="text" placeholder="Bono, adelanto, préstamo"></div><div class="fld"><label for="av">Valor en pesos</label><input id="av" type="number" min="0" placeholder="50000"></div><div class="pm"><button class="on" data-sg="1">Suma</button><button data-sg="-1">Resta</button></div><div class="act"><button class="btn" data-ok="${X.add}">Guardar</button><button class="btn g" data-x="1">Cancelar</button></div>`)}
 else if(X.sg){document.querySelectorAll(".pm button").forEach(x=>x.classList.toggle("on",x===b))}
 else if(X.ok){const v=+$("av").value,c=$("ac").value.trim()||"Ajuste",sg=+document.querySelector(".pm .on").dataset.sg;if(v>0){(S.adj[X.ok]=S.adj[X.ok]||[]).push({c,v:v*sg});save();closeSheet();renderN()}}
 else if(X.rm){const j=X.rm.lastIndexOf("|"),k=X.rm.slice(0,j);S.adj[k].splice(+X.rm.slice(j+1),1);save();renderN()}
 else if(X.pdf!==undefined)openRp(X.pdf);
 else if(X.rpx)closeRp();
 else if(X.rpp)savePdf();
 else if(b.id==="rs"){S.ov={};S.real={};S.adj={};save();render()}
 else if(b.id==="th"){const r=document.documentElement,dk=r.dataset.theme==="dark"||(!r.dataset.theme&&matchMedia("(prefers-color-scheme:dark)").matches);S.theme=dk?"light":"dark";r.dataset.theme=S.theme;save()}
});
document.addEventListener("change",e=>{
 const i=e.target;
 if(i.dataset.k&&i.type==="number"){S.real[i.dataset.k]=i.value;save();renderN()}
 else if(i.id==="sm"){S.sm=+i.value||1750905;save();render()}
 else if(i.id==="mes"){mk=i.value;const [y,m]=mk.split("-").map(Number);cur=clamp(Date.UTC(y,m-1,1));render()}
});
if(S.theme)document.documentElement.dataset.theme=S.theme;
render();
document.body.classList.add("hm");setInterval(()=>{if(view==="t")renderT()},60000);
const sp=$("sp"),h1=sp.querySelector("h1"),rm=matchMedia("(prefers-reduced-motion:reduce)").matches;
"EDS ORENSE".split("").forEach((c,i)=>{const s=document.createElement("span");s.textContent=c===" "?"\u00a0":c;s.style.animationDelay=(2.4+i*.17)+"s";h1.appendChild(s)});
let gone=false;
function lift(){if(gone)return;gone=true;sp.classList.add("up");$("home").classList.add("show");setTimeout(()=>sp.remove(),1300)}
sp.addEventListener("click",lift);setTimeout(lift,rm?600:6200);
</script>

<div id="gate"><div class="logo" role="img" aria-label="Terpel"></div><h1>EDS ORENSE</h1>
<form id="gateForm"><p>Inicia sesión para continuar</p>
<input id="gu" name="username" placeholder="Usuario" autocomplete="username" autocapitalize="none" autocorrect="off" required>
<input id="gp" name="password" type="password" placeholder="Contraseña" autocomplete="current-password" required>
<button type="submit" id="gb">Entrar</button>
<button type="button" class="lk" id="gr">¿Olvidaste tu contraseña?</button>
<div class="msg" id="gm"></div></form></div>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
async function savePdf(){
 var btn=document.querySelector('[data-rpp]'),el=document.getElementById('rpc'),txt='Guardar PDF';
 function done(){btn.disabled=false;btn.textContent=txt}
 async function deliver(f){
  try{
   if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:f.name});window._pdfFile=null;done();return}
  }catch(e){
   if(e&&e.name==='AbortError'){done();return}
   window._pdfFile=f;btn.disabled=false;btn.textContent='Toca otra vez para guardar';return
  }
  var u=URL.createObjectURL(f),a=document.createElement('a');a.href=u;a.download=f.name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(u)},60000);done()
 }
 if(window._pdfFile){var f0=window._pdfFile;btn.disabled=true;await deliver(f0);return}
 if(!window.html2canvas||!window.jspdf){window.print();return}
 btn.disabled=true;btn.textContent='Generando…';
 try{
  var P=window.jspdf.jsPDF,pdf=new P({unit:'pt',format:'a4'}),pw=pdf.internal.pageSize.getWidth(),ph=pdf.internal.pageSize.getHeight(),m=28,uw=pw-2*m,uh=ph-2*m,first=true;
  var secs=el.querySelectorAll('.pg'),targets=secs.length?Array.prototype.slice.call(secs):[el];
  for(var j=0;j<targets.length;j++){
   var cv=await html2canvas(targets[j],{scale:2,backgroundColor:'#ffffff',useCORS:true,windowWidth:820,
    onclone:function(d){var r=d.getElementById('rp');r.style.position='static';r.style.overflow='visible';r.style.height='auto';
     var b=d.querySelector('.rpb');if(b)b.style.display='none';var w=d.querySelector('.rp .wm');if(w)w.style.display='none';d.body.classList.remove('rpo')}});
   var k=cv.width/uw,sh=Math.floor(uh*k),y=0;
   while(y<cv.height){
    var h=Math.min(sh,cv.height-y),c=document.createElement('canvas');c.width=cv.width;c.height=h;
    var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,h);x.drawImage(cv,0,y,cv.width,h,0,0,cv.width,h);
    if(!first)pdf.addPage();first=false;
    pdf.addImage(c.toDataURL('image/jpeg',0.92),'JPEG',m,m,uw,h/k);y+=h
   }
  }
  var d=new Date(),n='EDS_Orense_'+d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)+'.pdf';
  await deliver(new File([pdf.output('blob')],n,{type:'application/pdf'}))
 }catch(e){done();window.print()}
}
</script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
(function(){
var g=document.getElementById('gate'),m=document.getElementById('gm'),b=document.getElementById('gb');
function say(t,ok){m.textContent=t;m.className='msg'+(ok?' ok':'')}
var C=window.EDS_FB,E=window.EDS_EMAIL,U=window.EDS_USER,auth;
if(!C||!C.apiKey||/PEGAR/.test(C.apiKey)||!window.firebase){say('Falta configurar Firebase (firebase-config.js).')}
else{
 firebase.initializeApp(C);auth=firebase.auth();
 var LIM=10*60*1000,KEY='eds_last',mem=0,thr=0;
 function stamp(){mem=Date.now();try{localStorage.setItem(KEY,String(mem))}catch(e){}}
 function last(){var l=0;try{l=+localStorage.getItem(KEY)||0}catch(e){}return Math.max(l,mem)}
 function expired(){var l=last();return !l||Date.now()-l>LIM}
 function lock(){if(auth.currentUser){auth.signOut()}document.getElementById('gp').value=''}
 auth.onAuthStateChanged(function(u){var ok=!!(u&&u.email&&u.email.toLowerCase()===E.toLowerCase());
  if(ok&&expired()){lock();return}
  if(ok)stamp();
  g.style.display=ok?'none':'flex'});
 ['pointerdown','keydown','touchstart','scroll'].forEach(function(ev){document.addEventListener(ev,function(){if(!auth.currentUser)return;var n=Date.now();if(n-thr>5000){thr=n;stamp()}},{passive:true,capture:true})});
 document.addEventListener('visibilitychange',function(){if(!auth.currentUser)return;if(document.hidden)stamp();else if(expired())lock()});
 setInterval(function(){if(auth.currentUser&&expired())lock()},15000);
 document.getElementById('gateForm').addEventListener('submit',function(e){e.preventDefault();
  var u=document.getElementById('gu').value.trim().toLowerCase(),p=document.getElementById('gp').value;
  if(u!==U){say('Usuario o contraseña incorrectos');return}
  b.disabled=true;say('');stamp();
  auth.signInWithEmailAndPassword(E,p).catch(function(er){
   var c=er.code||'';say(/network/.test(c)?'Sin conexión a internet':/too-many/.test(c)?'Demasiados intentos, espera unos minutos':'Usuario o contraseña incorrectos')
  }).then(function(){b.disabled=false})});
 document.getElementById('gr').addEventListener('click',function(){
  say('Enviando…',true);
  auth.sendPasswordResetEmail(E).then(function(){say('Te enviamos un enlace para restablecer la contraseña a '+E.charAt(0)+'•••'+E.slice(E.indexOf('@'))+'. Revisa también spam o correo no deseado.',true)})
  .catch(function(er){say(/network/.test(er.code||'')?'Sin conexión a internet':'No se pudo enviar el correo, intenta de nuevo')})});
}
if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
})();
</script>
